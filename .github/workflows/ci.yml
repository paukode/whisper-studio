name: CI

# Gates every PR on the backend test suite (which now includes the
# file-size-budget and package-re-export guardrails) plus the frontend
# typecheck / unit tests / production build.
#
# Triggers are scoped so a PR from a same-repo branch runs each check ONCE:
# push builds only main + version tags (post-merge / release), while
# pull_request covers the review gate. Listing both unscoped ran every check
# twice on PRs. workflow_dispatch runs the checks on any branch by hand.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (pytest on macOS)
    # The app runs on macOS only, so its backend is tested there, on every PR:
    # the sandbox is sandbox-exec and the open-with / reveal routes shell out
    # to `open`. The tests that need them fail, never skip, without them.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The Python of setup.sh: Homebrew's python@3.13. The python.org build
      # that actions/setup-python installs on macOS has a sqlite3 that cannot
      # load extensions, and the index stores its vectors with sqlite-vec.
      # The venv's bin goes on PATH, so python, pip and ruff below are the venv's.
      - name: Set up Homebrew Python 3.13
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew list python@3.13 >/dev/null 2>&1 || brew install python@3.13
          "$(brew --prefix)/opt/python@3.13/bin/python3.13" -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -c 'import sqlite3; sqlite3.connect(":memory:").enable_load_extension(True)'
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: pip-${{ runner.os }}-brew313-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-brew313-

      # The transcription / ML stack (mlx*, parakeet-mlx, torch/torchaudio/
      # speechbrain) is not exercised by the test suite: server.chat /
      # server.workspace and every test import cleanly without it. Strip those
      # lines so the install stays fast.
      # gliner pulls torch in transitively, so the strip doesn't keep torch
      # out; it just drops the pin, leaving CI to test a floating torch.
      # Constrain it to the version requirements.txt pins (torch==2.15.0) so
      # CI exercises the same torch the app ships. The paired setuptools<82
      # cap still holds: setuptools==81.0.0 survives the grep and installs
      # from requirements-ci.txt directly.
      - name: Install Python deps (test subset)
        run: |
          grep -vE '^(mlx|mlx-whisper|parakeet-mlx|torch|torchaudio|speechbrain)==' requirements.txt > /tmp/requirements-ci.txt
          printf 'torch==2.15.0\n' > /tmp/constraints-ci.txt
          python -m pip install --upgrade pip
          pip install -c /tmp/constraints-ci.txt -r /tmp/requirements-ci.txt

      # Name the cause first if the runner image ever loses these tools.
      - name: Assert the macOS tooling is present
        run: test -x /usr/bin/open && test -x /usr/bin/sandbox-exec

      # Lint + format gate, mirroring the frontend's `npm run lint`. ruff is
      # pinned in requirements.txt and survives the ML-strip grep above, so it's
      # already installed. Runs before pytest for fast feedback.
      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Run tests
        run: python -m pytest tests/

  frontend:
    name: Frontend (tsc + vitest + build)
    # The frontend checks do not depend on the OS, so they stay on the
    # cheaper Linux runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
