<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- The accent gradient, as in static/modules/themes.css -->
    <linearGradient id="ink" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0.25" stop-color="#9a82ff"/>
      <stop offset="1" stop-color="#7cb7f0"/>
    </linearGradient>
  </defs>
  <!-- macOS rounded square: 824x824 content on the 1024 grid, deep indigo -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="#1c1a4a"/>
  <!-- W monogram -->
  <polyline points="254,352 366,672 488,392 610,672 722,352"
            fill="none" stroke="url(#ink)" stroke-width="86"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- record dot as the period of "W.", baseline-aligned -->
  <circle cx="794" cy="671" r="44" fill="#ff7a7a"/>
</svg>
