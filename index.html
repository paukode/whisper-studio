<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whisper Studio</title>
    <script>
      // Set the mode before the stylesheets paint, so the page never flashes
      // the wrong mode. ThemeProvider takes over once React mounts.
      (function () {
        var mode = 'auto';
        try { mode = localStorage.getItem('whisper_theme') || 'auto'; } catch (e) {}
        var dark = mode.indexOf('dark') === 0 ||
          (mode.indexOf('light') !== 0 && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
    <link rel="stylesheet" href="/static/modules/themes.css">
    <link rel="stylesheet" href="/static/modules/toast.css">
    <link rel="stylesheet" href="/static/modules/dialog.css">
    <link rel="stylesheet" href="/static/modules/commands.css">
    <link rel="stylesheet" href="/static/modules/context-menu.css">
    <link rel="stylesheet" href="/static/modules/lsp-client.css">
    <link rel="stylesheet" href="/static/modules/terminal.css">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/modules/activity.css">
    <link rel="stylesheet" href="/static/modules/agent-report.css">
    <link rel="stylesheet" href="/static/modules/costs.css">
    <link rel="stylesheet" href="/static/modules/markdown.css">
    <link rel="stylesheet" href="/static/modules/viz.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
